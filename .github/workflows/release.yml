name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :probe:assembleRelease --console=plain

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ./gradlew :app:printVersion --console=plain -q \
            | grep -E '^VERSION_(NAME|CODE)=' \
            | sed 's/^VERSION_NAME=/version_name=/; s/^VERSION_CODE=/version_code=/' \
            >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/MoreDisplay-${{ steps.ver.outputs.version_name }}.apk"
          cp probe/build/outputs/apk/release/probe-release.apk \
             "out/MoreDisplayProbe-${{ steps.ver.outputs.version_name }}.apk"
          ls -l out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_ID}}"
          gh release create "$TAG" \
            --title "${{ steps.ver.outputs.version_name }}" \
            --generate-notes \
            out/*.apk
          gh release view "$TAG" --json body --jq .body > out/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: out/release-notes.md

  # 把元数据与 APK 推到 LSPosed 官方收录仓库 Xposed-Modules-Repo/<package>。
  # 只有配置了 LSPOSED_REPO_TOKEN（具备该仓库写权限的 PAT）时才会执行。
  publish-lsposed:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ secrets.LSPOSED_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_ID}}"
          gh release download "$TAG" --dir out --pattern '*.apk'
          # 收录仓库只放模块本体；probe 是验收用的探测程序，不随模块分发。
          rm -f out/MoreDisplayProbe-*.apk

      - name: Publish to Xposed-Modules-Repo
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
          VERSION_NAME: ${{ needs.release.outputs.version_name }}
          VERSION_CODE: ${{ needs.release.outputs.version_code }}
        run: |
          set -euo pipefail
          ./scripts/publish-lsposed.sh "$VERSION_CODE-$VERSION_NAME" "$VERSION_NAME" \
            release-notes.md out/*.apk
