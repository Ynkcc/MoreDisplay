name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # runner 镜像自带 Android SDK；缺失的 platform / build-tools 由 AGP 自行下载。
      # 不要用 android-actions/setup-android：它的默认 packages 含已被移除的 `tools` 包，
      # 在新版 cmdline-tools 上会直接失败。
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :probe:assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :probe:testDebugUnitTest --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: moredisplay-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/debug/*.apk
          if-no-files-found: error
